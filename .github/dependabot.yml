# Weekly pull requests for outdated or vulnerable dependencies.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /workers
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /bot
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # TypeScript 7 (the native port) is outside the range typescript-eslint
      # 8 accepts, so npm ci fails and with it the dashboard, Docker and
      # Windows jobs (pull request #17, 2026-11-22). Take it together with a
      # typescript-eslint that supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gomod
    directory: /upload-service
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories: [/api, /web, /upload-service]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # One pull request for all action updates: each pull request starts
    # about twenty CI jobs.
    groups:
      actions:
        patterns: ["*"]
