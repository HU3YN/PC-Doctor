name: ci

on:
  push:
    # Dependabot's branches are tested once, by pull_request below; without
    # this every Dependabot pull request ran both workflows twice.
    branches-ignore: ["dependabot/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: workers/pyproject.toml
      - run: pip install -e "workers[dev]"
      - run: ruff check workers && ruff format --check workers
      - run: pytest workers -q
      - name: The sample runs still get their expected diagnosis
        run: pcdoctor-analyze rules | tail -n 1

  api:
    name: api (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcdoctor
          POSTGRES_PASSWORD: pcdoctor
          POSTGRES_DB: pcdoctor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pcdoctor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PCDOCTOR_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://pcdoctor:pcdoctor@localhost:5432/pcdoctor_test' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            workers/pyproject.toml
            api/pyproject.toml
      - name: Tesseract (reads error photos)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - run: pip install -e workers -e "api[dev]"
      - run: ruff check api && ruff format --check api
      - name: Migrations match the models
        working-directory: api
        env:
          PCDOCTOR_DATABASE_URL: ${{ env.PCDOCTOR_TEST_DATABASE_URL }}
          PCDOCTOR_DATA_DIR: ${{ runner.temp }}/migration-check
        run: alembic upgrade head && alembic check
      - run: pytest api -q

  eval:
    name: evaluation scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            workers/pyproject.toml
            api/pyproject.toml
      - name: Tesseract (reads error photos)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - run: pip install -e workers -e "api[dev]"
      - run: ruff check eval && ruff format --check eval
      - run: python -m pytest eval/tests -q
      - name: Photo evaluation on drawn screens (a plumbing check, not a read rate)
        run: python eval/photo_eval.py --synthetic 10

  sensor-node:
    name: sensor node (host tests and receiver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Firmware protocol and SHT31 code, built and tested on the host
        run: make -C sensor-node/firmware/test_host && make -C sensor-node/firmware/test_host tool
      - run: pip install pytest ruff
      - run: ruff check sensor-node && ruff format --check sensor-node
      - name: Receiver (also parses packets made by the compiled C encoder)
        working-directory: sensor-node/receiver
        run: python -m pytest -q

  ml:
    name: models (CPU, synthetic data)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The CPU build of PyTorch: a fraction of the size of the default one.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r ml/frames/requirements.txt -r ml/leds/requirements.txt -e workers ruff
      - run: ruff check ml && ruff format --check ml
      - name: Frame-time model (ml/frames)
        working-directory: ml/frames
        run: python -m pytest -q
      - name: Train, evaluate, export and benchmark once (a plumbing check, not a result)
        working-directory: ml/frames
        run: |
          python train.py --series 60 --epochs 1 --out "$RUNNER_TEMP/frames"
          python evaluate.py --out "$RUNNER_TEMP/frames"
          python export_onnx.py --out "$RUNNER_TEMP/frames"
          python benchmark.py --out "$RUNNER_TEMP/frames" --repeats 5
      - name: Debug-LED reader (ml/leds)
        working-directory: ml/leds
        run: python -m pytest -q

  collector-rs:
    name: rust capture collector (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The analyzer reads what pcdoctor-capture wrote
        run: |
          python -m venv ../.venv && ../.venv/bin/pip install -q -e ../workers
          bash scripts/check-with-analyzer.sh

  collector-rs-windows:
    name: rust capture collector (real Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: collector-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  deploy-manifests:
    name: k3s manifests (schema check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      # Kubernetes objects are checked against their schemas; the Traefik and
      # cert-manager ones have none here and are skipped. Not a real cluster.
      - run: ~/go/bin/kubeconform -summary -strict -ignore-missing-schemas deploy/k8s/*.yaml

  web:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bot:
    name: discord bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bot/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q

  upload-service:
    name: upload service (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: upload-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: upload-service/go.mod
          cache-dependency-path: upload-service/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Fuzz the upload checker for a short while
        run: go test -run xxx -fuzz=FuzzCleanRun -fuzztime=20s .

  docker:
    name: docker compose (whole app)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: The dashboard and the API answer through nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q "<title>PC Doctor</title>"
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/runs/some-run | grep -q "<title>PC Doctor</title>"
          # nginx sends the security headers with the dashboard, the API with its answers.
          curl -fsSI http://localhost:8080/ | grep -qi "^content-security-policy: default-src 'self'"
          curl -fsS -D - -o /dev/null http://localhost:8080/api/health | grep -qi "^referrer-policy: no-referrer"
      - name: Nothing stored is readable without signing in
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/runs)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/worklog)" = "401"
      - name: Create the master account, then upload a run and log a job against PostgreSQL
        run: |
          set -euo pipefail
          CODE=$(docker compose exec -T api cat /data/setup-code.txt | tr -d '[:space:]')
          curl -fsS -c cookies.txt -X POST http://localhost:8080/api/auth/setup -H 'Content-Type: application/json' \
            -d "{\"username\": \"ci\", \"password\": \"a long ci password\", \"setup_code\": \"$CODE\"}"
          curl -fsS -b cookies.txt -X POST http://localhost:8080/api/demo
          test "$(curl -fsS -b cookies.txt http://localhost:8080/api/runs | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')" = "8"
          curl -fsS -b cookies.txt -X POST http://localhost:8080/api/worklog -H 'Content-Type: application/json' \
            -d '{"title": "Compose smoke test", "error_codes": ["0x124"]}' | grep -q '"id"'
          curl -fsS -b cookies.txt -X POST http://localhost:8080/api/worklog/similar -H 'Content-Type: application/json' \
            -d '{"codes": ["0x124"]}' | grep -q "Compose smoke test"
          curl -fsS -b cookies.txt http://localhost:8080/api/collector | grep -q '"photo_reading":true'
      - name: Data and the sign-in survive a restart
        run: |
          docker compose restart
          docker compose up -d --wait --wait-timeout 120
          curl -fsS -b cookies.txt "http://localhost:8080/api/worklog?q=compose" | grep -q "Compose smoke test"
      - name: The queue path - Go upload service, Redis, worker - and monitoring
        env:
          # Throwaway values for this test run only; the scale stack has no defaults.
          REDIS_PASSWORD: ci-redis-password-${{ github.run_id }}
          PCDOCTOR_METRICS_TOKEN: ci-metrics-token-${{ github.run_id }}
          GRAFANA_PASSWORD: ci-grafana-${{ github.run_id }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --build --wait --wait-timeout 240
          python3 -m pip install -q -e workers
          python3 deploy/loadtest/make_run.py
          REPLY=$(curl -fsS -F file=@deploy/loadtest/run.zip -F label="queued" http://localhost:8090/upload)
          JOB=$(echo "$REPLY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status_url"])')
          KEY=$(echo "$REPLY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["share_key"])')
          for i in $(seq 1 30); do
            STATE=$(curl -fsS "http://localhost:8090$JOB")
            echo "$STATE" | grep -q '"done"' && break
            echo "$STATE" | grep -q '"failed"' && { echo "$STATE"; exit 1; }
            sleep 1
          done
          echo "$STATE" | grep -q '"done"'
          curl -fsS "http://localhost:8080/api/shared/$KEY" | grep -q '"label":"queued"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/metrics)" = "401"
          sleep 20   # one scrape interval
          curl -fsS 'http://localhost:9090/api/v1/query?query=up' > up.json
          python3 -c 'import json; r=json.load(open("up.json"))["data"]["result"]; up={x["metric"]["job"]: x["value"][1] for x in r}; print(up); assert up=={"api":"1","upload":"1","worker":"1"}, up'
          curl -fsS http://localhost:3000/api/health | grep -q '"database": *"ok"'
          # Prometheus loaded every rule in deploy/monitoring/alerts.yml, and each evaluates without error.
          EXPECTED=$(python3 -c 'import yaml; print(sum(len(g["rules"]) for g in yaml.safe_load(open("deploy/monitoring/alerts.yml"))["groups"]))')
          # A rule reads "unknown" until its first evaluation (every minute by
          # default), so wait for that before judging; "err" fails at once.
          for i in $(seq 1 45); do
            curl -fsS http://localhost:9090/api/v1/rules > rules.json
            python3 -c 'import json,sys; r=[x for g in json.load(open("rules.json"))["data"]["groups"] for x in g["rules"]]; sys.exit(1 if any(x.get("health")=="unknown" for x in r) else 0)' && break
            sleep 2
          done
          python3 - "$EXPECTED" <<'PY'
          import json, sys
          expected = int(sys.argv[1])
          doc = json.load(open("rules.json"))
          assert doc["status"] == "success", doc["status"]
          rules = [r for g in doc["data"]["groups"] for r in g["rules"]]
          bad = [(r["name"], r.get("health"), r.get("lastError")) for r in rules if r.get("health") != "ok" or r.get("lastError")]
          print(f"{len(rules)} rules loaded, {expected} expected, not healthy: {bad}")
          assert expected > 0 and len(rules) >= expected, (len(rules), expected)
          assert not bad, bad
          PY
          # Grafana provisioned the PC Doctor dashboard (it may take a moment after the API is up).
          for i in $(seq 1 15); do
            curl -fsS -u "admin:$GRAFANA_PASSWORD" 'http://localhost:3000/api/search?query=PC%20Doctor' > dash.json || true
            python3 -c 'import json,sys; sys.exit(0 if any(d.get("title")=="PC Doctor" for d in json.load(open("dash.json"))) else 1)' 2>/dev/null && break
            sleep 2
          done
          python3 -c 'import json; d=json.load(open("dash.json")); print(d); assert any(x.get("title")=="PC Doctor" for x in d), "dashboard PC Doctor not provisioned"'
          # Redis refuses a client without the password.
          docker compose -f docker-compose.yml -f docker-compose.scale.yml exec -T redis \
            sh -c 'unset REDISCLI_AUTH; redis-cli ping' | grep -q NOAUTH
      - name: Logs if something failed
        if: failure()
        env:
          REDIS_PASSWORD: ci-redis-password-${{ github.run_id }}
          PCDOCTOR_METRICS_TOKEN: ci-metrics-token-${{ github.run_id }}
          GRAFANA_PASSWORD: ci-grafana-${{ github.run_id }}
        run: docker compose -f docker-compose.yml -f docker-compose.scale.yml logs --no-color --tail 80

  collector:
    name: collector (real Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scripts are plain ASCII and the launcher has CRLF line endings
        shell: pwsh
        run: |
          $bad = Get-ChildItem collector, Start-PCDoctor.ps1, Start-PCDoctor.cmd -Recurse -Include *.ps1, *.psm1, *.psd1, *.cmd | Where-Object {
            [System.IO.File]::ReadAllBytes($_.FullName) | Where-Object { $_ -gt 127 } | Select-Object -First 1
          }
          if ($bad) { Write-Error "Non-ASCII characters in: $($bad.Name -join ', ')"; exit 1 }
          $cmd = [System.IO.File]::ReadAllText('collector/PCDoctor.cmd')
          if ($cmd -notmatch "`r`n" -or $cmd -match "(?<!`r)`n") { Write-Error 'PCDoctor.cmd must use CRLF line endings'; exit 1 }
          'ok'

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          $found = Invoke-ScriptAnalyzer -Path collector -Recurse -Settings collector/PSScriptAnalyzerSettings.psd1
          $found | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 200
          if ($found) { Write-Error "$(@($found).Count) PSScriptAnalyzer finding(s)"; exit 1 }
          'clean'

      - name: Unit tests on Windows PowerShell 5.1
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.0 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = 'collector/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Unit tests on PowerShell 7
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'collector/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $config

      - name: Quick run on Windows PowerShell 5.1
        id: quick
        shell: powershell
        run: collector/tests/Invoke-IntegrationTest.ps1 -Mode Quick -Shell powershell

      - name: Quick run on PowerShell 7
        shell: pwsh
        run: collector/tests/Invoke-IntegrationTest.ps1 -Mode Quick -Shell pwsh

      - name: Fetch PresentMon (checks SHA-256 and Intel's signature)
        shell: powershell
        run: collector/Get-Tools.ps1

      - name: Capture run on Windows PowerShell 5.1
        id: capture
        shell: powershell
        run: collector/tests/Invoke-IntegrationTest.ps1 -Mode Capture -Seconds 8 -Shell powershell

      - name: Launcher runs the collector
        shell: cmd
        env:
          PCDOCTOR_NO_ELEVATE: "1"
        run: |
          call collector\PCDoctor.cmd -Mode Quick -NonInteractive -OutputDir "%RUNNER_TEMP%\launcher-run" < nul
          dir /b "%RUNNER_TEMP%\launcher-run\*.zip"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # The temperature driver end to end on a real Windows: the collector
      # installs PawnIO itself, reads the sensors through it, removes it, and
      # nothing of it may be left (Invoke-IntegrationTest checks).
      - name: Capture with the temperature driver (install, read, remove)
        shell: powershell
        run: |
          python api/pcdoctor_api/services/collector_build.py fetch-tools collector
          if ($LASTEXITCODE -ne 0) { exit 1 }
          collector/tests/Invoke-IntegrationTest.ps1 -Mode Capture -Seconds 8 -Shell powershell -TemperatureDriver

      - name: The analyzer reads what the collector wrote
        shell: pwsh
        run: |
          pip install -q -e workers
          foreach ($dir in '${{ steps.quick.outputs.run_dir }}', '${{ steps.capture.outputs.run_dir }}') {
            Write-Host "=== $dir"
            pcdoctor-analyze $dir
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $result = pcdoctor-analyze $dir --json | ConvertFrom-Json
            $unread = @($result.notes | Where-Object { $_ -match 'could not be read|is missing|does not know' })
            if ($unread) { Write-Error "The analyzer could not read the collector's output: $($unread -join '; ')"; exit 1 }
            if (-not $result.device.cpu) { Write-Error 'No CPU in the analysis result'; exit 1 }
          }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Start-PCDoctor.ps1 starts the master app without Docker
        shell: powershell
        run: ./Start-PCDoctor.ps1 -Mode Python -Check -Port 8091

      - name: The running app serves the dashboard and the collector download
        shell: pwsh
        run: |
          $server = Start-Process -FilePath .venv/Scripts/python.exe -ArgumentList '-m', 'pcdoctor_api', '--port', '8092' -PassThru -NoNewWindow
          try {
            $ok = $false
            foreach ($i in 1..30) { try { if ((Invoke-RestMethod http://localhost:8092/api/health).status -eq 'ok') { $ok = $true; break } } catch { Start-Sleep 1 } }
            if (-not $ok) { throw 'the app did not start' }
            if ((Invoke-WebRequest http://localhost:8092/get).Content -notmatch '<title>PC Doctor</title>') { throw 'dashboard not served' }
            Invoke-WebRequest http://localhost:8092/api/collector.zip -OutFile "$env:RUNNER_TEMP/collector.zip"
            Expand-Archive "$env:RUNNER_TEMP/collector.zip" "$env:RUNNER_TEMP/usb"
            # Run the downloaded copy exactly as it would run from a USB stick.
            $env:PCDOCTOR_NO_ELEVATE = '1'
            cmd /c "`"$env:RUNNER_TEMP\usb\PCDoctor-collector\PCDoctor.cmd`" -Mode Quick -NonInteractive -UploadUrl http://localhost:8092 < nul"
            # The collector uploaded as a guest. Only the signed-in master can list runs.
            try { Invoke-RestMethod http://localhost:8092/api/runs; throw 'runs are readable without signing in' } catch { if ($_.Exception.Message -match 'readable') { throw } }
            $code = (Get-Content data/setup-code.txt -Raw).Trim()
            $body = @{ username = 'ci'; password = 'a long ci password'; setup_code = $code } | ConvertTo-Json
            Invoke-RestMethod http://localhost:8092/api/auth/setup -Method Post -ContentType 'application/json' -Body $body -SessionVariable master | Out-Null
            $runs = Invoke-RestMethod http://localhost:8092/api/runs -WebSession $master
            if ($runs.total -ne 1) { throw "expected 1 uploaded run, found $($runs.total)" }
            if ($runs.items[0].source -ne 'guest') { throw 'the collector upload should count as a guest upload' }
            Write-Host "Uploaded from the 'USB' copy: $($runs.items[0].headline)"
            if (-not (Get-ChildItem "$env:RUNNER_TEMP/usb/PCDoctor-collector/runs/*.zip")) { throw 'no zip saved next to the collector' }
          } finally { Stop-Process -Id $server.Id -Force }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: collector-runs
          path: |
            ${{ steps.quick.outputs.run_dir }}
            ${{ steps.capture.outputs.run_dir }}
          if-no-files-found: ignore
          retention-days: 7
