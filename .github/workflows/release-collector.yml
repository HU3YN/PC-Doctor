name: release collector

# Builds the collector zip, attests where it came from, and publishes it as a
# GitHub release. Runs when a tag like collector-v1.0.0 is pushed:
#
#   git tag collector-v1.0.0 && git push origin collector-v1.0.0
#
# The zip is built by api/pcdoctor_api/services/collector_build.py - the same
# code the server uses for /api/collector.zip - so the copy a PC Doctor server
# offers for that commit has the same SHA-256 as the release. Intel's
# PresentMon is fetched (pinned by SHA-256) and packed inside. Check a copy
# before running it as administrator:
#
#   gh attestation verify PCDoctor-collector.zip --repo HU3YN/PC-Doctor
#
# "Run workflow" (manual) builds and attests without publishing a release.
#
# This is the one workflow that signs something, so every action is pinned to
# a commit, not a tag that could be moved.

on:
  push:
    tags: ["collector-v*"]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # a short-lived Sigstore certificate for the attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # PresentMon's binary is not in git. This downloads the version
      # Get-Tools.ps1 pins from Intel's release and fails unless its SHA-256
      # is the pinned one.
      - name: Fetch PresentMon (Intel's frame-time recorder, checked by SHA-256)
        run: python3 api/pcdoctor_api/services/collector_build.py fetch-presentmon collector

      - name: Build the zip (standard library only, same bytes as /api/collector.zip)
        run: >-
          python3 api/pcdoctor_api/services/collector_build.py --require-presentmon
          collector dist/PCDoctor-collector.zip

      - name: Record its SHA-256
        working-directory: dist
        run: |
          sha256sum PCDoctor-collector.zip > PCDoctor-collector.zip.sha256
          cat PCDoctor-collector.zip.sha256

      - name: Attest where it came from (this repository, this workflow, this commit)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/PCDoctor-collector.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/collector-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          SUM=$(cut -d' ' -f1 dist/PCDoctor-collector.zip.sha256)
          cat > notes.md <<EOF
          The PC Doctor collector: read-only, runs from a USB stick.

          SHA-256 of PCDoctor-collector.zip: \`$SUM\`

          Check it before running it as administrator:

              gh attestation verify PCDoctor-collector.zip --repo ${{ github.repository }}

          or, on Windows without gh, compare with the hash above:

              Get-FileHash .\PCDoctor-collector.zip -Algorithm SHA256

          PresentMon is included, so frame-time captures work straight from
          this one zip. It is Intel's program, unmodified
          (tools/PresentMon-*-x64.exe): this build checked its SHA-256 against
          the one pinned in Get-Tools.ps1, and the collector checks Intel's
          signature every time before running it. Intel's licence is in
          PresentMon-LICENSE.txt.
          EOF
          gh release create "$TAG" dist/PCDoctor-collector.zip dist/PCDoctor-collector.zip.sha256 \
            --verify-tag --title "Collector $TAG" --notes-file notes.md
