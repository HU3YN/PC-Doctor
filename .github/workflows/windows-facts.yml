# Dumps facts straight from a real Windows machine so the collector and the
# rules engine can be checked against Windows itself instead of from memory:
# event definitions, storage class value maps, stop-code names from the
# Windows SDK, and PresentMon's real CLI and CSV header.
# Run it by hand from the Actions tab (it also runs when this file changes).
# What it found is written up in docs/verified-facts.md.
name: windows-facts

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-facts.yml

permissions:
  contents: read

jobs:
  whea-events:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: WHEA-Logger event definitions
        shell: powershell
        run: |
          $meta = Get-WinEvent -ListProvider 'Microsoft-Windows-WHEA-Logger'
          Write-Output ("LogLinks: " + (($meta.LogLinks | ForEach-Object { $_.LogName }) -join ', '))
          $seen = @{}
          foreach ($e in $meta.Events) {
            if ($e.LogLink.LogName -ne 'System') { continue }
            $desc = ($e.Description -replace '\s+', ' ')
            if ($desc.Length -gt 230) { $desc = $desc.Substring(0, 230) }
            $key = "$($e.Id)|$desc"
            if ($seen.ContainsKey($key)) { continue }
            $seen[$key] = $true
            Write-Output ("ID={0} Level={1} :: {2}" -f $e.Id, $e.Level.DisplayName, $desc)
          }

  storage-maps:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Storage class value maps
        shell: powershell
        run: |
          foreach ($c in 'MSFT_PhysicalDisk', 'MSFT_Volume', 'MSFT_Disk') {
            $cls = Get-CimClass -Namespace root/Microsoft/Windows/Storage -ClassName $c
            foreach ($prop in $cls.CimClassProperties) {
              if ($prop.Name -notin 'HealthStatus', 'MediaType', 'BusType', 'OperationalStatus', 'DriveType') { continue }
              $vm = $prop.Qualifiers['ValueMap']; $vals = $prop.Qualifiers['Values']
              $line = "{0}.{1} ({2})" -f $c, $prop.Name, $prop.CimType
              if ($vm -and $vals) {
                $pairs = for ($i = 0; $i -lt $vm.Value.Count; $i++) { "{0}={1}" -f $vm.Value[$i], $vals.Value[$i] }
                $line += " :: " + ($pairs -join '; ')
              }
              Write-Output $line
            }
          }
          Write-Output '--- what the cmdlets return for these (type and text)'
          Get-PhysicalDisk | ForEach-Object { "{0} | MediaType={1} ({2}) | BusType={3} | Health={4} | OpStatus={5}" -f $_.FriendlyName, $_.MediaType, $_.MediaType.GetType().Name, $_.BusType, $_.HealthStatus, ($_.OperationalStatus -join ',') }
          Write-Output '--- Win32_PhysicalMemory SMBIOSMemoryType / FormFactor sample'
          Get-CimInstance Win32_PhysicalMemory | Select-Object DeviceLocator, BankLabel, Capacity, Speed, ConfiguredClockSpeed, SMBIOSMemoryType, FormFactor, Manufacturer, PartNumber | Format-List
          Get-CimInstance Win32_PhysicalMemoryArray | Select-Object MemoryDevices, MaxCapacityEx | Format-List
          Write-Output '--- Win32_SystemEnclosure ChassisTypes / PCSystemType'
          (Get-CimInstance Win32_SystemEnclosure).ChassisTypes -join ','
          (Get-CimInstance Win32_ComputerSystem).PCSystemType
          Write-Output '--- one sample of the counters the collector falls back to'
          $paths = '\Processor Information(_Total)\% Processor Utility', '\Processor Information(_Total)\% Processor Performance', '\Processor Information(_Total)\Actual Frequency', '\Processor Information(_Total)\% Performance Limit', '\Memory\Available Bytes'
          (Get-Counter -Counter $paths -ErrorAction SilentlyContinue).CounterSamples | ForEach-Object { "{0} = {1}" -f $_.Path, $_.CookedValue }
          try { (Get-Counter -Counter '\GPU Engine(*)\Utilization Percentage' -ErrorAction Stop).CounterSamples | Select-Object -First 3 | ForEach-Object { "{0} = {1}" -f $_.Path, $_.CookedValue } } catch { "GPU Engine counter: $($_.Exception.Message)" }
          try { (Get-Counter -Counter '\Thermal Zone Information(*)\Temperature' -ErrorAction Stop).CounterSamples | ForEach-Object { "{0} = {1}" -f $_.Path, $_.CookedValue } } catch { "Thermal zone counter: $($_.Exception.Message)" }

  bugcheck-names:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Stop code names from the Windows SDK header bugcodes.h
        shell: powershell
        run: |
          $hdr = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Recurse -Filter bugcodes.h -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $hdr) { Write-Output 'bugcodes.h not found'; exit 0 }
          Write-Output $hdr.FullName
          $rx = [regex]'^#define\s+([A-Z0-9_]+)\s+\(\(ULONG\)0x([0-9A-Fa-f]+)L\)'
          $out = New-Object System.Collections.Generic.List[string]
          foreach ($line in [System.IO.File]::ReadLines($hdr.FullName)) {
            $m = $rx.Match($line)
            if ($m.Success) { $out.Add(("{0}={1}" -f $m.Groups[2].Value.TrimStart('0').ToUpper(), $m.Groups[1].Value)) }
          }
          Write-Output ("COUNT " + $out.Count)
          # Printed 8 per line to keep the log short.
          for ($i = 0; $i -lt $out.Count; $i += 8) { Write-Output ("BC " + (($out[$i..([Math]::Min($i + 7, $out.Count - 1))]) -join ' ')) }

  presentmon:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: PresentMon real CLI and CSV header
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/GameTechDev/PresentMon/releases/latest' -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          Write-Output ("Latest release: {0} published {1}" -f $rel.tag_name, $rel.published_at)
          $asset = $rel.assets | Where-Object { $_.name -match '^PresentMon-.*-x64\.exe$' } | Select-Object -First 1
          $exe = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $exe
          Write-Output ("SHA256 " + (Get-FileHash $exe -Algorithm SHA256).Hash)
          Write-Output ("Signature: " + (Get-AuthenticodeSignature $exe).Status + " / " + (Get-AuthenticodeSignature $exe).SignerCertificate.Subject)
          function Invoke-PM([string[]]$PmArgs, [string]$Tag) {
            # PresentMon prints its banner on stderr, so it is started with
            # Start-Process and both streams go to files (never 2>&1).
            $o = Join-Path $env:RUNNER_TEMP "$Tag.out.txt"; $e = Join-Path $env:RUNNER_TEMP "$Tag.err.txt"
            $p = Start-Process -FilePath $exe -ArgumentList $PmArgs -NoNewWindow -Wait -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
            Write-Output "=================== $Tag  args: $($PmArgs -join ' ')  exit: $($p.ExitCode)"
            Write-Output '--- stdout'; if (Test-Path $o) { Get-Content $o | Select-Object -First 90 }
            Write-Output '--- stderr'; if (Test-Path $e) { Get-Content $e | Select-Object -First 25 }
          }
          Invoke-PM @('--help') 'help'
          # Give PresentMon something to measure: a window that repaints.
          $form = Start-Process powershell -PassThru -ArgumentList '-NoProfile', '-Command', 'Add-Type -AssemblyName System.Windows.Forms; $f = New-Object Windows.Forms.Form; $t = New-Object Windows.Forms.Timer; $t.Interval = 16; $t.add_Tick({ $f.BackColor = [Drawing.Color]::FromArgb((Get-Random -Max 255), 80, 80); $f.Refresh() }); $t.Start(); [Windows.Forms.Application]::Run($f)'
          Start-Sleep -Seconds 3
          $csv = Join-Path $env:RUNNER_TEMP 'pm.csv'
          Invoke-PM @('--output_file', "`"$csv`"", '--timed', '8', '--terminate_after_timed', '--no_console_stats', '--stop_existing_session', '--session_name', 'PCDoctorProbe') 'default'
          if (Test-Path $csv) { Write-Output ("rows: " + (Get-Content $csv | Measure-Object).Count); Get-Content $csv -TotalCount 4 } else { Write-Output 'no CSV written' }
          $csv1 = Join-Path $env:RUNNER_TEMP 'pm_v1.csv'
          Invoke-PM @('--output_file', "`"$csv1`"", '--timed', '5', '--terminate_after_timed', '--no_console_stats', '--stop_existing_session', '--session_name', 'PCDoctorProbe', '--v1_metrics') 'v1_metrics'
          if (Test-Path $csv1) { Get-Content $csv1 -TotalCount 3 } else { Write-Output 'no CSV written' }
          $csv2 = Join-Path $env:RUNNER_TEMP 'pm_v2.csv'
          Invoke-PM @('--output_file', "`"$csv2`"", '--timed', '5', '--terminate_after_timed', '--no_console_stats', '--stop_existing_session', '--session_name', 'PCDoctorProbe', '--v2_metrics') 'v2_metrics'
          if (Test-Path $csv2) { Get-Content $csv2 -TotalCount 3 } else { Write-Output 'no CSV written' }
          Stop-Process -Id $form.Id -Force -ErrorAction SilentlyContinue

  # The CPU temperature plan (docs/plan.md, Step 1) installs the PawnIO driver
  # for a capture and removes it after. Before that is built: does a real
  # Windows accept PawnIO's driver, does the uninstall leave nothing, does
  # Defender react, and does LibreHardwareMonitorLib load in Windows
  # PowerShell 5.1? A cloud VM's CPU may report no temperature; that part
  # still needs the owner's PC.
  pawnio-probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install PawnIO, read the CPU, uninstall (Probe-CpuTemperature.ps1)
        shell: powershell
        run: |
          & collector/tests/Probe-CpuTemperature.ps1 -Yes
          Write-Output "probe exit code: $LASTEXITCODE"
          $result = 'collector/runs/cpu-temperature-probe.json'
          if (Test-Path $result) { Get-Content $result -Raw } else { Write-Output 'no result file' }
          # Not a pass/fail check: the facts above are the point.
          exit 0
