[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pcdoctor-analysis"
version = "0.1.0"
description = "PC Doctor analysis: parses a collector run and finds what is wrong with the PC."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# Standard library only on purpose: this runs anywhere Python does.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6.100"]

[project.scripts]
pcdoctor-analyze = "pcdoctor_analysis.cli:main"

[tool.setuptools.packages.find]
include = ["pcdoctor_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test data reads better on one line.
"tests/*" = ["E501"]
