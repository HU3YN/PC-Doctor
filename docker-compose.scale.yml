# Phase 3 add-on: the queue path and monitoring, on one machine.
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --build
#
#   http://localhost:8080   the dashboard (as before)
#   http://localhost:8090   the Go upload service (POST /upload)
#   http://localhost:9090   Prometheus
#   http://localhost:3000   Grafana (sign in: admin / the password below)
#
# Everything extra listens on this computer only.
#
# Three secrets must be set in .env first (see .env.example); there are no
# defaults, so a forgotten one stops the start instead of running with a
# password everyone knows: REDIS_PASSWORD, PCDOCTOR_METRICS_TOKEN,
# GRAFANA_PASSWORD. Letters, digits, "-" and "_" only (they go into URLs).

services:
  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["sh", "-c", "exec redis-server --save 60 1 --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env - see .env.example}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env - see .env.example}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    environment:
      PCDOCTOR_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env - see .env.example}@redis:6379/0
      PCDOCTOR_METRICS_TOKEN: ${PCDOCTOR_METRICS_TOKEN:?Set PCDOCTOR_METRICS_TOKEN in .env - see .env.example}
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "pcdoctor_api.worker"]
    environment:
      PCDOCTOR_DATABASE_URL: postgresql://pcdoctor:${POSTGRES_PASSWORD:-pcdoctor}@db:5432/pcdoctor
      PCDOCTOR_DATA_DIR: /data
      PCDOCTOR_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env - see .env.example}@redis:6379/0
      PCDOCTOR_AUTO_MIGRATE: "false"   # the API owns the schema
      # The worker tells the same webhook about guest runs it processes.
      PCDOCTOR_NOTIFY_WEBHOOK_URL: ${PCDOCTOR_NOTIFY_WEBHOOK_URL:-}
    volumes:
      - rundata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  upload:
    build:
      context: .
      dockerfile: upload-service/Dockerfile
    environment:
      PCDOCTOR_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env - see .env.example}@redis:6379/0
      PCDOCTOR_SPOOL_DIR: /data/spool
      PCDOCTOR_MAX_UPLOAD_MB: ${PCDOCTOR_MAX_UPLOAD_MB:-200}
    volumes:
      - rundata:/data
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      # The API image creates /data with the right owner; start after it.
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    secrets:
      - metrics_token   # read as a file: /run/secrets/metrics_token
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.3.0@sha256:a0f881232a6fb71a0554a47d0fe2203b6888fe77f4cefb7ea62bed7eb54e13c3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env - see .env.example}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

secrets:
  metrics_token:
    environment: PCDOCTOR_METRICS_TOKEN

volumes:
  redisdata:
  promdata:
  grafanadata:
