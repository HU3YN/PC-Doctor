# Same style as api/, workers/ and eval/.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[lint.per-file-ignores]
"tests/*" = ["E501"]

[lint.isort]
# These scripts are imported by each other and by the tests as top-level modules.
known-first-party = ["dataset", "model", "metrics", "train", "evaluate", "export_onnx", "benchmark"]
