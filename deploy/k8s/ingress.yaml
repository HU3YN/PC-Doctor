# The only way in from the internet: HTTPS, with a Let's Encrypt certificate
# that cert-manager renews. Plain HTTP is redirected.
#
# Before applying, replace both placeholders:
#   pcdoctor.example.com   your domain (its A record must point at the server)
#   you@example.com        where Let's Encrypt sends expiry warnings
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-only
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    stsSeconds: 31536000
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pcdoctor
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: pcdoctor-https-only@kubernetescrd,pcdoctor-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [pcdoctor.example.com]
      secretName: pcdoctor-tls
  rules:
    - host: pcdoctor.example.com
      http:
        paths:
          # The Go upload service. Its /metrics and /healthz are NOT published.
          - {path: /upload, pathType: Exact, backend: {service: {name: upload, port: {number: 8090}}}}
          - {path: /jobs/, pathType: Prefix, backend: {service: {name: upload, port: {number: 8090}}}}
          # Everything else: the dashboard, which passes /api on to the API.
          - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
