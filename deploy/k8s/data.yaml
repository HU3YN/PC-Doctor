# PostgreSQL, Redis and the shared data volume.
# Passwords come from the "pcdoctor-secrets" Secret, which you create by hand
# (deploy/README.md) so that nothing secret is ever in this repository.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rundata
spec:
  accessModes: [ReadWriteOnce] # one server: every pod is on the same node
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: pcdoctor}
            - {name: POSTGRES_DB, value: pcdoctor}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: pcdoctor-secrets, key: postgres-password}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, pcdoctor, -d, pcdoctor]
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector: {app: db}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # A queue of jobs waiting a few seconds: nothing worth writing to disk.
          # A password even inside the cluster: anything that gets a foothold
          # in another pod should not be able to read or forge jobs.
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: pcdoctor-secrets, key: redis-password}
            - {name: REDISCLI_AUTH, value: $(REDIS_PASSWORD)}
          args: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --requirepass, $(REDIS_PASSWORD)]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports:
    - port: 6379
