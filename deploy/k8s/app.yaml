# The app: API, worker, upload service and dashboard.
#
# Images are built on the server and imported into k3s (deploy/README.md), so
# no registry is needed: imagePullPolicy is Never.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pcdoctor-config
data:
  PCDOCTOR_DATA_DIR: /data
  PCDOCTOR_SPOOL_DIR: /data/spool
  # PCDOCTOR_REDIS_URL is set per container: it carries the Redis password.
  PCDOCTOR_TRUST_PROXY: "true"
  PCDOCTOR_MAX_UPLOAD_MB: "200"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy: {type: Recreate} # the migration runs at start-up: one copy at a time
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: pcdoctor/api:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef: {name: pcdoctor-config}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: pcdoctor-secrets, key: postgres-password}
            - name: PCDOCTOR_DATABASE_URL
              value: postgresql://pcdoctor:$(POSTGRES_PASSWORD)@db:5432/pcdoctor
            - name: PCDOCTOR_METRICS_TOKEN
              valueFrom:
                secretKeyRef: {name: pcdoctor-secrets, key: metrics-token}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: pcdoctor-secrets, key: redis-password}
            - name: PCDOCTOR_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/0
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: pcdoctor-secrets, key: anthropic-api-key, optional: true}
            # Traefik, then nginx, each add an X-Forwarded-For entry. Without
            # this every caller looked like Traefik and shared one rate limit,
            # so anyone could lock the master out of signing in.
            - {name: PCDOCTOR_PROXY_HOPS, value: "2"}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: rundata, mountPath: /data}
      volumes:
        - name: rundata
          persistentVolumeClaim: {claimName: rundata}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1 # raise this when the queue backs up (QueueBacklog alert)
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      terminationGracePeriodSeconds: 60 # finish the job in hand
      containers:
        - name: worker
          image: pcdoctor/api:local
          imagePullPolicy: Never
          command: [python, -m, pcdoctor_api.worker]
          envFrom:
            - configMapRef: {name: pcdoctor-config}
          env:
            - {name: PCDOCTOR_AUTO_MIGRATE, value: "false"}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: pcdoctor-secrets, key: postgres-password}
            - name: PCDOCTOR_DATABASE_URL
              value: postgresql://pcdoctor:$(POSTGRES_PASSWORD)@db:5432/pcdoctor
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: pcdoctor-secrets, key: redis-password}
            - name: PCDOCTOR_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/0
          ports:
            - containerPort: 9101
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: rundata, mountPath: /data}
      volumes:
        - name: rundata
          persistentVolumeClaim: {claimName: rundata}
---
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  selector: {app: worker}
  ports:
    - port: 9101
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload
spec:
  replicas: 1
  selector:
    matchLabels: {app: upload}
  template:
    metadata:
      labels: {app: upload}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: upload
          image: pcdoctor/upload:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef: {name: pcdoctor-config}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: pcdoctor-secrets, key: redis-password}
            - name: PCDOCTOR_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/0
          ports:
            - containerPort: 8090
          readinessProbe:
            httpGet: {path: /healthz, port: 8090}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 768Mi} # the compressed upload, never the unpacked one
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: rundata, mountPath: /data}
            - {name: tmp, mountPath: /tmp} # multipart forms spill large files here
      volumes:
        - name: rundata
          persistentVolumeClaim: {claimName: rundata}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: upload
spec:
  selector: {app: upload}
  ports:
    - port: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: pcdoctor/web:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports:
    - port: 80
