# Only the services that need the data stores can reach them. Without these,
# any pod in the cluster (or anything that gets a foothold in one) could
# connect to PostgreSQL and Redis directly. k3s enforces NetworkPolicy out of
# the box. Not applied to a real cluster yet - see deploy/README.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-from-api-and-worker
spec:
  podSelector:
    matchLabels: {app: db}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api}}
        - podSelector: {matchLabels: {app: worker}}
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-app
spec:
  podSelector:
    matchLabels: {app: redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api}}
        - podSelector: {matchLabels: {app: worker}}
        - podSelector: {matchLabels: {app: upload}}
      ports:
        - {protocol: TCP, port: 6379}
