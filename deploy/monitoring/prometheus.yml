# Prometheus for the Docker Compose stack (docker-compose.scale.yml).
# On k3s the same jobs are in deploy/k8s/monitoring.yaml.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /api/metrics
    authorization:
      # PCDOCTOR_METRICS_TOKEN, handed over by Compose as a secret file
      # (docker-compose.scale.yml), so it is never written in this file.
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]
  - job_name: upload
    static_configs:
      - targets: ["upload:8090"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9101"]
