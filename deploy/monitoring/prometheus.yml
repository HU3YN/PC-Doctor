# Prometheus for the Docker Compose stack (docker-compose.scale.yml).
# On k3s the same jobs are in deploy/k8s/monitoring.yaml.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /api/metrics
    authorization:
      # Matches PCDOCTOR_METRICS_TOKEN. This default is for a stack that only
      # this computer can reach; anywhere else, set your own in .env and here.
      credentials: local-metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: upload
    static_configs:
      - targets: ["upload:8090"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9101"]
