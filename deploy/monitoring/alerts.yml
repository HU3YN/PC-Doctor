groups:
  - name: pcdoctor
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} is not answering Prometheus"
      - alert: QueueBacklog
        expr: pcdoctor_queue_depth > 20
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} uploads have been waiting for a worker for 5 minutes"
      - alert: WorkerStalled
        expr: time() - pcdoctor_worker_last_poll_timestamp > 120
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "The worker has not asked for a job in two minutes"
      - alert: UploadErrors
        expr: sum(rate(pcdoctor_upload_requests_total{outcome="error"}[5m])) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "The upload service is failing uploads"
      - alert: ApiErrors
        expr: >
          sum(rate(pcdoctor_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(pcdoctor_http_requests_total[5m])) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "More than 5% of API requests are failing"
      - alert: SlowDiagnosis
        expr: >
          histogram_quantile(0.95,
          sum(rate(pcdoctor_upload_to_diagnosis_seconds_bucket[10m])) by (le)) > 30
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "95% of uploads take more than 30 s to be diagnosed"
