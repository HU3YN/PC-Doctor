# The whole app on one machine:
#
#   docker compose up -d --build      then open http://localhost:8080
#   docker compose logs -f api        to watch the API
#   docker compose down               to stop (your data is kept)
#
# Data lives in two named volumes: pgdata (the database, including your work
# log) and rundata (the uploaded run files). "docker compose down -v" deletes
# both - export the work log first (Work log > Backup).

services:
  db:
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    environment:
      POSTGRES_USER: pcdoctor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcdoctor}
      POSTGRES_DB: pcdoctor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcdoctor -d pcdoctor"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PCDOCTOR_DATABASE_URL: postgresql://pcdoctor:${POSTGRES_PASSWORD:-pcdoctor}@db:5432/pcdoctor
      PCDOCTOR_DATA_DIR: /data
      PCDOCTOR_MAX_UPLOAD_MB: ${PCDOCTOR_MAX_UPLOAD_MB:-200}
      PCDOCTOR_TRUST_PROXY: "true"   # nginx in front sets X-Forwarded-For
      # Optional AI helper. Leave unset to keep it off.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional sign-in with Discord or Google (docs/oauth.md). PUBLIC_URL is
      # the address people use in the browser; OAuth needs it to come back.
      PCDOCTOR_PUBLIC_URL: ${PCDOCTOR_PUBLIC_URL:-}
      PCDOCTOR_DISCORD_CLIENT_ID: ${PCDOCTOR_DISCORD_CLIENT_ID:-}
      PCDOCTOR_DISCORD_CLIENT_SECRET: ${PCDOCTOR_DISCORD_CLIENT_SECRET:-}
      PCDOCTOR_GOOGLE_CLIENT_ID: ${PCDOCTOR_GOOGLE_CLIENT_ID:-}
      PCDOCTOR_GOOGLE_CLIENT_SECRET: ${PCDOCTOR_GOOGLE_CLIENT_SECRET:-}
      PCDOCTOR_OAUTH_SIGNUP: ${PCDOCTOR_OAUTH_SIGNUP:-false}
      # Optional Discord webhook told about new guest runs (headline only).
      PCDOCTOR_NOTIFY_WEBHOOK_URL: ${PCDOCTOR_NOTIFY_WEBHOOK_URL:-}
      # Optional: the Discord bot's own upload limit (bot/README.md).
      PCDOCTOR_BOT_TOKEN: ${PCDOCTOR_BOT_TOKEN:-}
      PCDOCTOR_BOT_UPLOADS_PER_HOUR: ${PCDOCTOR_BOT_UPLOADS_PER_HOUR:-300}
    volumes:
      - rundata:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      # 127.0.0.1 = reachable from this computer only. Stored runs need a
      # sign-in, but this serves plain HTTP: set PCDOCTOR_BIND=0.0.0.0 only on
      # a network you trust, and never expose it to the internet without HTTPS.
      - "${PCDOCTOR_BIND:-127.0.0.1}:${PCDOCTOR_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  rundata:
