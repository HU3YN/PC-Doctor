# Serves the built dashboard and passes /api to the API container, so the
# browser talks to one address.
# The access log never shows a private link or token: the secret part of
# these paths becomes a placeholder (the API does the same in its own log:
# api/pcdoctor_api/logs.py).
map $request_uri $logged_uri {
    "~^(?<prefix>/(api/shared|r|api/photo-links|snap)/)[^/?#]+(?<rest>.*)$"  "${prefix}<key>${rest}";
    "~^/api/live/[^/?#]+/samples(?<rest>.*)$"                              "/api/live/<token>/samples${rest}";
    default                                                               $request_uri;
}
# The usual "combined" format, with the redacted path and no Referer.
log_format redacted '$remote_addr - [$time_local] "$request_method $logged_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log redacted;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded runs can be large (a long capture is tens of megabytes).
    client_max_body_size 250m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # File names of built assets change with their content: cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The dashboard routes in the browser (/runs/abc): anything else is index.html.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
