# Serves the built dashboard and passes /api to the API container, so the
# browser talks to one address.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded runs can be large (a long capture is tens of megabytes).
    client_max_body_size 250m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # File names of built assets change with their content: cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The dashboard routes in the browser (/runs/abc): anything else is index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
