# Included in every location of nginx.conf that serves the dashboard. (nginx
# drops server-level add_header lines in a location that has its own, so they
# are repeated by include rather than set once.) The API sends the same
# headers itself: api/pcdoctor_api/main.py, SECURITY_HEADERS.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
