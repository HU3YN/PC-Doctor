; PC Doctor case-sensor node. Build: pio run    Flash: pio run -t upload
; Serial monitor: pio device monitor
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
; To sample at another rate without editing code, add for example:
;   -DPCD_SAMPLE_INTERVAL_MS=500
