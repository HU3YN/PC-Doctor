[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pcdoctor-bot"
version = "0.1.0"
description = "PC Doctor Discord bot: /diagnose uploads a collector run and replies with the diagnosis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "discord.py>=2.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pcdoctor-bot = "pcdoctor_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["pcdoctor_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
