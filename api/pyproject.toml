[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pcdoctor-api"
version = "0.1.0"
description = "PC Doctor backend: stores runs, findings and the work log; serves the dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pcdoctor-analysis",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Reading error photos. Also needs the Tesseract OCR program installed.
photo = ["pytesseract>=0.3.10", "pillow>=10"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pytesseract>=0.3.10", "pillow>=10"]

[project.scripts]
pcdoctor-api = "pcdoctor_api.__main__:main"

[tool.setuptools.packages.find]
include = ["pcdoctor_api*"]

[tool.setuptools.package-data]
pcdoctor_api = ["migrations/*", "migrations/versions/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# SIM905: word lists read better as one string. SIM114: the stemmer keeps one rule per line.
ignore = ["SIM905", "SIM114"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]
