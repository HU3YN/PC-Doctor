# Used when you run alembic by hand from this folder, e.g.
#   alembic revision --autogenerate -m "add a column"
#   alembic upgrade head
# The database URL comes from the app's settings (PCDOCTOR_DATABASE_URL).
[alembic]
script_location = pcdoctor_api/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
