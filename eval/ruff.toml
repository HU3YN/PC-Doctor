# Same style as api/ and workers/, so the eval scripts read like the code they test.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[lint.per-file-ignores]
"tests/*" = ["E501"]

[lint.isort]
# The eval scripts are imported by the tests as top-level modules.
known-first-party = ["photo_eval", "run_eval", "agent_eval"]
